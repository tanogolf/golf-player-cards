<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif; background: #f5f5f5; color: #333; line-height: 1.6; }
  main { max-width: 560px; margin: 0 auto; padding: 12px 16px 40px; }
  a { color: #457B9D; }
  .back { margin: 4px 0 12px; font-size: 14px; }
  .back a { text-decoration: none; }
  h1 { margin: 0; font-size: 26px; color: #1D3557; }
  h1 small { font-size: 15px; font-weight: normal; }
  .type { display: inline-block; margin: 6px 0 14px; padding: 2px 14px; border-radius: 999px;
    background: #2A9D8F; color: #ffffff; font-size: 14px; font-weight: bold; }
  .card { display: block; width: 100%; height: auto; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.18); }
  table { width: 100%; margin-top: 20px; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,.12); font-size: 15px; }
  caption { margin-bottom: 6px; text-align: left; font-size: 13px; font-weight: bold; color: #5f6b76; }
  th, td { padding: 10px 12px; border-bottom: 1px solid #e3e8ee; text-align: right; }
  th { text-align: left; font-weight: normal; }
  tr:last-child th, tr:last-child td { border-bottom: 0; }
  thead th { font-size: 12px; color: #5f6b76; background: #fafbfc; }
  .pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 20px; font-size: 14px; }
  .pager a { text-decoration: none; }
  .shindan { margin: 24px 0 0; text-align: center; font-weight: bold; }
  .shindan a { display: block; padding: 14px; border-radius: 12px; background: #1D3557; color: #fff; text-decoration: none; }
  .note { margin-top: 20px; text-align: center; font-size: 12px; color: #5f6b76; }
  .flip { perspective: 2000px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .flip-inner { position: relative; transition: transform .6s; transform-style: preserve-3d; }
  .flip.flipped .flip-inner { transform: rotateY(180deg); }
  .face { display: block; width: 100%; height: auto; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.18);
    -webkit-backface-visibility: hidden; backface-visibility: hidden; transform: rotateY(0deg); }
  .face-back { position: absolute; top: 0; left: 0; transform: rotateY(180deg); }
  .flip-button { margin: 12px 0 0; text-align: center; }
  .flip-button button { padding: 8px 20px; border: 2px solid #457B9D; border-radius: 999px; background: #fff; color: #457B9D;
    font: inherit; font-size: 15px; font-weight: bold; cursor: pointer; }

</style>
<script data-goatcounter="https://tanogolf.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body>
<main>
  <p class="back"><a href="../index.html">← 選手カード一覧に戻る</a></p>
  <h1>Ｍ・ヘンドリー <small>選手</small></h1>
  <p class="type">安定感型・総合力 52（Bランク）</p>
  <div class="flip" id="card" title="タップで裏返す">
    <div class="flip-inner">
      <img class="face" src="../fronts/Ｍ・ヘンドリー_2026.png" alt="Ｍ・ヘンドリー選手のカード（表）" width="1080" height="1350">
      <img class="face face-back" src="../cards/Ｍ・ヘンドリー_2026.png" alt="Ｍ・ヘンドリー選手のステータスカード（裏）" width="1080" height="1350" aria-hidden="true">
    </div>
  </div>
  <p class="flip-button"><button type="button" id="flip">↻ 裏返す（ステータスを見る）</button></p>
  <table>
    <caption>2026年度 部門別成績（JGTO公式データ）</caption>
    <thead><tr><th scope="col">項目</th><th scope="col">成績</th><th scope="col">ツアー順位</th></tr></thead>
    <tbody>
      <tr><th scope="row">パワー(飛距離)</th><td>284.5yd</td><td>64位</td></tr>
      <tr><th scope="row">正確性(FWキープ率)</th><td>55.2%</td><td>69位</td></tr>
      <tr><th scope="row">決定力(パット)</th><td>1.762</td><td>39位</td></tr>
      <tr><th scope="row">安定感(パーオン率)</th><td>69.1%</td><td>20位</td></tr>
    </tbody>
  </table>
  <nav class="pager"><a href="15589.html">← 岩井 亮磨</a><a href="15741.html">小平 智 →</a></nav>
  <p class="shindan"><a href="../shindan.html">⛳ あなたに近いプロは誰？<br>4問でわかる「あなたに近いプロ診断」</a></p>
  <p class="note">2026年度 JGTO公式データに基づく</p>
</main>
<script>
  // カードをタップするか、ボタンを押すと裏返す
  (() => {
    const card = document.getElementById("card");
    const button = document.getElementById("flip");
    const [front, back] = card.querySelectorAll(".face");
    function flip() {
      const toBack = !card.classList.contains("flipped");
      card.classList.toggle("flipped", toBack);
      front.setAttribute("aria-hidden", String(toBack));
      back.setAttribute("aria-hidden", String(!toBack));
      button.textContent = toBack ? "↻ 表に戻す" : "↻ 裏返す（ステータスを見る）";
      // アクセス解析（公開時に差し込むGoatCounter）。手元で開いたときは window.goatcounter が無いので何もしない
      if (toBack && window.goatcounter && window.goatcounter.count) {
        window.goatcounter.count({ path: "click/カード裏返し", event: true });
      }
    }
    card.addEventListener("click", flip);
    button.addEventListener("click", flip);
  })();
</script>
</body>
</html>
